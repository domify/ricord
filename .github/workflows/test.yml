name: test

# Runs bin/test once per engine: SQLite (required) and Turso (not blocking until M4).
# The repository and its siblings are checked out side by side, so ris.mod's
# `replace ../db` and `../sqlite` (and the example's `../../../web`) resolve.

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, turso]
    container:
      image: crystallang/crystal:1.21.0-build
    env:
      LC_ALL: C.UTF-8
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    steps:
      - uses: actions/checkout@v5
        with:
          path: ricord
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: domify/db
          ref: v0.3.1
          path: db
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: domify/sqlite
          ref: v0.2.0
          path: sqlite
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: domify/web
          ref: v0.1.0
          path: web
          persist-credentials: false

      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ruby binutils curl \
            libsqlite3-dev libreadline-dev libssl-dev libncurses-dev

      - name: Read the pins
        id: pin
        shell: bash
        run: |
          grep -E '^(ris_commit|turso_commit)=' ricord/.ris-version >> "$GITHUB_OUTPUT"

      - name: Restore ris
        id: ris-cache
        uses: actions/cache@v5
        with:
          path: ris
          key: ris-${{ steps.pin.outputs.ris_commit }}

      - name: Build ris
        if: steps.ris-cache.outputs.cache-hit != 'true'
        run: |
          git init -q ris
          git -C ris fetch -q --depth 1 https://github.com/rislang/ris.git "${{ steps.pin.outputs.ris_commit }}"
          git -C ris checkout -q FETCH_HEAD
          make -C ris iyi

      - name: Restore libturso
        id: turso-cache
        uses: actions/cache@v5
        with:
          path: ricord/vendor/turso/lib
          key: turso-${{ steps.pin.outputs.turso_commit }}

      - name: Build libturso
        if: steps.turso-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          ricord/bin/build-turso

      - name: Tests on ${{ matrix.engine }}
        shell: bash
        working-directory: ricord
        run: |
          mkdir -p build/tmp
          RICORD_ENGINE=${{ matrix.engine }} RIS_ANY=1 TEST_JOBS=$(nproc) RIS=$GITHUB_WORKSPACE/ris/bin/ris \
            TMPDIR=$PWD/build/tmp bin/test
